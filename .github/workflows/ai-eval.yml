# Bộ câu mẫu AI với Claude thật, chỉ chạy tay (docs/70-kiem-thu mục 3.7). Trần 0,5 USD mỗi lần do bài kiểm tự dừng.
name: ai-eval

on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Chạy pytest -m ai_eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_EVAL }}
        run: |
          docker compose -f infra/docker-compose.test.yml --profile ai build test
          docker compose -f infra/docker-compose.test.yml --profile ai run --rm test-ai
      - name: Dọn
        if: always()
        run: docker compose -f infra/docker-compose.test.yml down -v
