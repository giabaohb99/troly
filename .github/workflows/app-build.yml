# Kiểm giao diện mỗi lần đổi app/ (docs/50-ha-tang mục 3.7).
# QĐ-32: APK bản phát hành build, ký và đăng từ máy cá nhân bằng scripts/release-apk.sh; GitHub không giữ secret nào.
name: app-build

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/app-build.yml"
  pull_request:
    paths:
      - "app/**"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
