# Bản chạy thật (VPS), cũng là nền ở máy cá nhân. Chi tiết: docs/50-ha-tang/50-ha-tang-trien-khai.md mục 3.2, 3.3.
# VPS: ảnh troly-backend:<sha> do scripts/deploy.sh dựng; api chỉ nghe 127.0.0.1:8200, Cloudflare Tunnel trỏ vào.
# Máy cá nhân: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
name: troly

x-backend: &backend
  image: troly-backend:${TROLY_IMAGE_TAG:-latest}
  env_file: .env
  restart: unless-stopped
  stop_grace_period: 30s
  labels:
    com.troly.image: "1"
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:16-alpine
    container_name: troly-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-troly}
      POSTGRES_USER: ${POSTGRES_USER:-troly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}
      TZ: UTC
    command: postgres -c shared_buffers=128MB -c max_connections=30 -c log_min_duration_statement=1000
    volumes:
      - troly-pgdata:/var/lib/postgresql/data
    networks: [troly_core]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 512M }
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  migrate:
    <<: *backend
    container_name: troly-migrate
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    networks: [troly_core]
    depends_on:
      db: { condition: service_healthy }
    profiles: ["migrate"]

  api:
    <<: *backend
    container_name: troly-api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8200}:8000"
    networks: [troly_core, troly_edge]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 448M }

  worker:
    <<: *backend
    container_name: troly-worker
    command: ["python", "-m", "worker.main"]
    networks: [troly_core, troly_edge]
    depends_on:
      db: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384M }

  # Cầu nối Zalo qua zca-js (QĐ-52, docs/50-ha-tang mục 3.15). Không mở cổng; api gọi http://zalo-bridge:3000.
  # Chỉ nhận các biến ZALO_* và R2_ENDPOINT, không đọc cả .env.
  # Nằm sau profile `zalo`: không chạy mặc định khi deploy. Bật: docker compose --profile zalo up -d zalo-bridge
  zalo-bridge:
    profiles: ["zalo"]
    build: ./zalo-bridge
    image: troly-zalo-bridge:${TROLY_IMAGE_TAG:-latest}
    container_name: troly-zalo-bridge
    environment:
      TZ: UTC
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ZALO_DATA_DIR: /data
      # Không bắt buộc ở mức compose (profile tắt thì không cần); bridge tự kiểm khi khởi động.
      ZALO_SESSION_KEY: ${ZALO_SESSION_KEY:-}
      ZALO_BRIDGE_TOKEN: ${ZALO_BRIDGE_TOKEN:-}
      ZALO_EVENTS_URL: ${ZALO_EVENTS_URL:-http://api:8000/api/v1/internal/zalo/events}
      ZALO_SEND_PER_MINUTE: ${ZALO_SEND_PER_MINUTE:-20}
      ZALO_ATTACHMENT_HOSTS: ${ZALO_ATTACHMENT_HOSTS:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
    volumes:
      - troly-zalo-data:/data
    networks: [troly_core, troly_edge]
    restart: unless-stopped
    stop_grace_period: 15s
    labels:
      com.troly.image: "1"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }

volumes:
  troly-pgdata:
  troly-zalo-data:

networks:
  troly_core:
    internal: true
  troly_edge: {}
