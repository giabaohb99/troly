# Bộ mẫu OTP dùng chung cho lớp lọc trên máy (Kotlin) và lưới ở máy chủ (app/modules/device/otp.py).
# 60 mục 3.5, 70 mục 3.4. Mẫu TỰ SOẠN theo dạng thường gặp, số và tên đều giả; thêm mẫu thật đã che khi có.
# expect: block (phải chặn, lọt một mẫu là hỏng) | pass (không được chặn; chặn nhầm tối đa 10 phần trăm).
# package: tên gói app gửi thông báo. SMS dùng com.samsung.android.messaging (S25+, QĐ-19).

