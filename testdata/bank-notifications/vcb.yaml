- id: vcb-chi-001
  package: com.VCB
  title: "Thông báo VCB"
  text: "So du TK VCB 0011xxxx9876 -45,000 VND luc 18-11-2026 12:05:11. So du 2,345,000 VND. Ref MBVCB.12345678.AB12.Com trua"
